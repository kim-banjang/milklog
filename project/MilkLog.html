<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MilkLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #EEF1F5;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 28px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  #stage { transform-origin: center center; }
</style>
</head>
<body>
  <div id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="storage.js"></script>
  <script src="helpers.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="EditPanel.jsx"></script>
  <script type="text/babel" src="LogItem.jsx"></script>
  <script type="text/babel" src="CalendarView.jsx"></script>
  <script type="text/babel" src="tabs.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="react">
    function MilkLogStage() {
      // Fit the 402×874 device into the viewport.
      const [scale, setScale] = React.useState(1);
      React.useEffect(() => {
        const fit = () => {
          const pad = 32;
          const s = Math.min(
            (window.innerWidth - pad) / 402,
            (window.innerHeight - pad) / 874,
            1
          );
          setScale(s);
        };
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);
      return (
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
          <IOSDevice>
            <BabyFeedingTracker />
          </IOSDevice>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('stage')).render(<MilkLogStage />);
  </script>
</body>
</html>
